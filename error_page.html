<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: {{css .FontFamily "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"}};
        background: {{css .Background "var(--background)"}};
        color: var(--foreground);
        margin: 0;
      }
      :root,
      :host {
        --spacing: 0.25rem;
        --container-md: 28rem;
        --text-sm: {{css .TextSm "0.875rem"}};
        --text-sm--line-height: calc(1.25 / 0.875);
        --text-2xl: {{css .Text2xl "1.5rem"}};
        --text-2xl--line-height: calc(2 / 1.5);
        --text-4xl: {{css .Text4xl "2.25rem"}};
        --text-4xl--line-height: calc(2.5 / 2.25);
        --text-6xl: {{css .Text6xl "3rem"}};
        --text-6xl--line-height: 1;
        --font-weight-medium: 500;
        --font-weight-semibold: 600;
        --font-weight-bold: 700;
        --default-transition-duration: 150ms;
        --default-transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        --radius: {{css .RadiusSm "0.625rem"}};
        --default-mono-font-family: {{css .MonoFontFamily "var(--font-geist-mono)"}};
        --primary: {{css .Primary "black"}};
        --primary-foreground: {{css .PrimaryForeground "white"}};
        --background: {{css .Background "white"}};
        --foreground: {{css .Foreground "oklch(0.271 0 0)"}};
        --border: {{css .Border "oklch(0.89 0 0)"}};
        --destructive: {{css .Destructive "oklch(0.55 0.15 25.723)"}};
        --muted-foreground: {{css .MutedForeground "oklch(0.545 0 0)"}};
        --corner-border: {{css .CornerBorder "#404040"}};
      }

      button, .btn {
        cursor: pointer;
        background: none;
        border: none;
        color: inherit;
        font: inherit;
        transition: all var(--default-transition-duration)
          var(--default-transition-timing-function);
      }
      button:hover, .btn:hover {
        opacity: 0.8;
      }

      @media (prefers-color-scheme: dark) {
        :root,
        :host {
          --primary: {{css .Primary "white"}};
          --primary-foreground: {{css .PrimaryForeground "black"}};
          --background: {{css .Background "oklch(0.15 0 0)"}};
          --foreground: {{css .Foreground "oklch(0.98 0 0)"}};
          --border: {{css .Border "oklch(0.27 0 0)"}};
          --destructive: {{css .Destructive "oklch(0.65 0.15 25.723)"}};
          --muted-foreground: {{css .MutedForeground "oklch(0.65 0 0)"}};
          --corner-border: {{css .CornerBorder "#a0a0a0"}};
        }
      }
      @media (max-width: 640px) {
        :root, :host {
          --text-6xl: 2.5rem;
          --text-2xl: 1.25rem;
          --text-sm: 0.8125rem;
        }
      }
      @media (max-width: 480px) {
        :root, :host {
          --text-6xl: 2rem;
          --text-2xl: 1.125rem;
        }
      }
    </style>
  </head>
  <body style="width: 100vw; min-height: 100vh; overflow-x: hidden; overflow-y: auto;">
    <div
        style="
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            position: relative;
            width: 100%;
            min-height: 100vh;
            padding: 1rem;
        "
        >
{{if not .DisableBackgroundGrid}}
      <div
        style="
          position: absolute;
          inset: 0;
          background-image: linear-gradient(to right, {{css .GridColor "var(--border)"}} 1px, transparent 1px),
            linear-gradient(to bottom, {{css .GridColor "var(--border)"}} 1px, transparent 1px);
          background-size: 40px 40px;
          opacity: 0.6;
          pointer-events: none;
          width: 100vw;
          height: 100vh;
        "
      ></div>
      <div
        style="
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: {{css .Background "var(--background)"}};
          mask-image: radial-gradient(ellipse at center, transparent 20%, black);
          -webkit-mask-image: radial-gradient(ellipse at center, transparent 20%, black);
          pointer-events: none;
        "
      ></div>
{{end}}

<div
  style="
    position: relative;
    z-index: 10;
    border: 2px solid var(--border);
    background: {{css .CardBackground "var(--background)"}};
    padding: 1.5rem;
    max-width: 42rem;
    width: 100%;
  "
>
    {{if not .DisableCornerDecorations}}
        <div
          style="
            position: absolute;
            top: -2px;
            left: -2px;
            width: 2rem;
            height: 2rem;
            border-top: 4px solid var(--corner-border);
            border-left: 4px solid var(--corner-border);
          "
        ></div>
        <div
          style="
            position: absolute;
            top: -2px;
            right: -2px;
            width: 2rem;
            height: 2rem;
            border-top: 4px solid var(--corner-border);
            border-right: 4px solid var(--corner-border);
          "
        ></div>
  
        <div
          style="
            position: absolute;
            bottom: -2px;
            left: -2px;
            width: 2rem;
            height: 2rem;
            border-bottom: 4px solid var(--corner-border);
            border-left: 4px solid var(--corner-border);
          "
        ></div>
        <div
          style="
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 2rem;
            height: 2rem;
            border-bottom: 4px solid var(--corner-border);
            border-right: 4px solid var(--corner-border);
          "
        ></div>{{end}}

        <div style="text-align: center; margin-bottom: 1.5rem;">
          <div style="margin-bottom: 1.5rem;">
            <div
              style="
                display: inline-block;
                border: 2px solid {{if .DisableTitleBorder}}transparent{{else}}{{css .TitleBorder "var(--destructive)"}}{{end}};
                padding: 0.375rem 1rem;
              "
            >
              <h1
                style="
                  font-size: var(--text-6xl);
                  font-weight: var(--font-weight-semibold);
                  color: {{css .TitleColor "var(--foreground)"}};
                  letter-spacing: -0.02em;
                  margin: 0;
                "
              >
                ERROR
              </h1>
            </div>
            <div
              style="
                height: 2px;
                background-color: var(--border);
                width: calc(100% + 3rem);
                margin-left: -1.5rem;
                margin-top: 1.5rem;
              "
            ></div>
          </div>

          <h2
            style="
              font-size: var(--text-2xl);
              font-weight: var(--font-weight-semibold);
              color: var(--foreground);
              margin: 0 0 1rem;
            "
          >
            Something went wrong
          </h2>

          <div
            style="
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                border: 2px solid var(--border);
                background-color: var(--muted);
                padding: 0.375rem 0.75rem;
                margin: 0 0 1rem;
                flex-wrap: wrap;
                justify-content: center;
            "
            >
            <span
                style="
                font-size: 0.75rem;
                color: var(--muted-foreground);
                font-weight: var(--font-weight-semibold);
                "
            >
                CODE:
            </span>
            <span
                style="
                font-size: var(--text-sm);
                font-family: var(--default-mono-font-family, monospace);
                color: var(--foreground);
                word-break: break-all;
                "
            >
                {{.Code}}
            </span>
            </div>

          <p
            style="
              color: var(--muted-foreground);
              max-width: 28rem;
              margin: 0 auto;
              font-size: var(--text-sm);
              line-height: 1.5;
              text-wrap: pretty;
            "
          >
            {{with .Description}}{{.}}{{else}}We encountered an unexpected error. Please try again or return to the home page.{{end}}
          </p>
        </div>

        <div
          style="
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
          "
        >
          <a
            href="/"
            style="
              text-decoration: none;
            "
          >
            <div
              style="
                border: 2px solid var(--border);
                background: var(--primary);
                color: var(--primary-foreground);
                padding: 0.5rem 1rem;
                border-radius: 0;
                white-space: nowrap;
              "
              class="btn"
            >
              Go Home
            </div>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
